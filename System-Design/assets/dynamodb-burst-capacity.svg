<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">DynamoDB burst capacity: a simplified comparison</title>
  <desc id="description">Two conceptual plots use the same requested work and a 100 capacity-unit-per-second baseline. Without using saved units, admitted work is capped at 100. With saved units, the early spike of 160 can be admitted; after those savings are consumed, later sustained demand still exceeds admitted work. Blue is admitted traffic, orange dashed is demand, and grey dashed is the baseline. This is not measured AWS performance, a complete capacity simulator, or a customer-controlled enable-bursting switch.</desc>
  <defs>
    <marker id="pointer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1440" height="820" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="720" y="45" text-anchor="middle" font-size="30" font-weight="700">Saved capacity can absorb a short spike</text>
    <text x="720" y="80" text-anchor="middle" font-size="20">The baseline stays the same; saved unused units temporarily admit more work.</text>
  <g transform="translate(32 0)" data-panel="fixed-baseline">
    <rect x="0" y="112" width="676" height="535" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="338" y="152" text-anchor="middle" font-size="23" font-weight="700">Without using saved units</text>
    <text x="338" y="181" text-anchor="middle" font-size="17" fill="#475569">Conceptual comparison, not an AWS configuration option</text>
    <line x1="76" y1="500" x2="634" y2="500" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="506" text-anchor="end" font-size="17" fill="#475569">0</text>
    <line x1="76" y1="427.5" x2="634" y2="427.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="433.5" text-anchor="end" font-size="17" fill="#475569">50</text>
    <line x1="76" y1="355" x2="634" y2="355" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="361" text-anchor="end" font-size="17" fill="#475569">100</text>
    <line x1="76" y1="282.5" x2="634" y2="282.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="288.5" text-anchor="end" font-size="17" fill="#475569">150</text>
    <line x1="76" y1="210" x2="634" y2="210" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="216" text-anchor="end" font-size="17" fill="#475569">200</text>
    <text x="76" y="526" text-anchor="middle" font-size="17" fill="#475569">0</text>
    <text x="138" y="526" text-anchor="middle" font-size="17" fill="#475569">1</text>
    <text x="200" y="526" text-anchor="middle" font-size="17" fill="#475569">2</text>
    <text x="262" y="526" text-anchor="middle" font-size="17" fill="#475569">3</text>
    <text x="324" y="526" text-anchor="middle" font-size="17" fill="#475569">4</text>
    <text x="386" y="526" text-anchor="middle" font-size="17" fill="#475569">5</text>
    <text x="448" y="526" text-anchor="middle" font-size="17" fill="#475569">6</text>
    <text x="510" y="526" text-anchor="middle" font-size="17" fill="#475569">7</text>
    <text x="572" y="526" text-anchor="middle" font-size="17" fill="#475569">8</text>
    <text x="634" y="526" text-anchor="middle" font-size="17" fill="#475569">9</text>
    <path d="M 76 210 V 500 H 634" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="76" y1="355" x2="634" y2="355" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" data-baseline="100"/>
    <polyline points="76,442.0 138,442.0 200,355.0 262,355.0 324,384.0 386,384.0 448,355.0 510,355.0 572,355.0 634,355.0" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" data-series="admitted" data-values="40,40,100,100,80,80,100,100,100,100"/>
    <polyline points="76,442.0 138,442.0 200,268.0 262,268.0 324,384.0 386,384.0 448,268.0 510,268.0 572,268.0 634,268.0" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" data-series="demand" data-values="40,40,160,160,80,80,160,160,160,160"/>
    <text transform="translate(22 355) rotate(-90)" text-anchor="middle" font-size="18">Capacity units / second</text>
    <text x="355" y="557" text-anchor="middle" font-size="19">Time (equal intervals)</text>
    <text x="238" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Excess demand throttles</text>
    <path d="M 238 241 L 238 345" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#pointer)"/>
    <text x="338" y="602" text-anchor="middle" font-size="19">Admitted work stays at or below the baseline.</text>
    <text x="338" y="628" text-anchor="middle" font-size="17" fill="#475569">Requested work can exceed what the baseline alone can serve.</text>
  </g>
  <g transform="translate(732 0)" data-panel="saved-units">
    <rect x="0" y="112" width="676" height="535" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="338" y="152" text-anchor="middle" font-size="23" font-weight="700">Using saved unused units</text>
    <text x="338" y="181" text-anchor="middle" font-size="17" fill="#475569">Conceptual comparison, not an AWS configuration option</text>
    <line x1="76" y1="500" x2="634" y2="500" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="506" text-anchor="end" font-size="17" fill="#475569">0</text>
    <line x1="76" y1="427.5" x2="634" y2="427.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="433.5" text-anchor="end" font-size="17" fill="#475569">50</text>
    <line x1="76" y1="355" x2="634" y2="355" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="361" text-anchor="end" font-size="17" fill="#475569">100</text>
    <line x1="76" y1="282.5" x2="634" y2="282.5" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="288.5" text-anchor="end" font-size="17" fill="#475569">150</text>
    <line x1="76" y1="210" x2="634" y2="210" stroke="#e2e8f0" stroke-width="1"/>
    <text x="63" y="216" text-anchor="end" font-size="17" fill="#475569">200</text>
    <text x="76" y="526" text-anchor="middle" font-size="17" fill="#475569">0</text>
    <text x="138" y="526" text-anchor="middle" font-size="17" fill="#475569">1</text>
    <text x="200" y="526" text-anchor="middle" font-size="17" fill="#475569">2</text>
    <text x="262" y="526" text-anchor="middle" font-size="17" fill="#475569">3</text>
    <text x="324" y="526" text-anchor="middle" font-size="17" fill="#475569">4</text>
    <text x="386" y="526" text-anchor="middle" font-size="17" fill="#475569">5</text>
    <text x="448" y="526" text-anchor="middle" font-size="17" fill="#475569">6</text>
    <text x="510" y="526" text-anchor="middle" font-size="17" fill="#475569">7</text>
    <text x="572" y="526" text-anchor="middle" font-size="17" fill="#475569">8</text>
    <text x="634" y="526" text-anchor="middle" font-size="17" fill="#475569">9</text>
    <path d="M 76 210 V 500 H 634" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="76" y1="355" x2="634" y2="355" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" data-baseline="100"/>
    <polyline points="76,442.0 138,442.0 200,268.0 262,268.0 324,384.0 386,384.0 448,297.0 510,355.0 572,355.0 634,355.0" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" data-series="admitted" data-values="40,40,160,160,80,80,140,100,100,100"/>
    <polyline points="76,442.0 138,442.0 200,268.0 262,268.0 324,384.0 386,384.0 448,268.0 510,268.0 572,268.0 634,268.0" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" data-series="demand" data-values="40,40,160,160,80,80,160,160,160,160"/>
    <text transform="translate(22 355) rotate(-90)" text-anchor="middle" font-size="18">Capacity units / second</text>
    <text x="355" y="557" text-anchor="middle" font-size="19">Time (equal intervals)</text>
    <text x="238" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">Early spike absorbed</text>
    <path d="M 238 241 L 238 262" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#pointer)"/>
    <text x="528" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Savings exhausted</text>
    <path d="M 528 390 L 550 362" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#pointer)"/>
    <text x="338" y="602" text-anchor="middle" font-size="19">Later sustained excess still throttles.</text>
    <text x="338" y="628" text-anchor="middle" font-size="17" fill="#475569">Saved capacity is temporary, not a larger permanent allocation.</text>
  </g>
    <line x1="60" y1="692" x2="130" y2="692" stroke="#1d4ed8" stroke-width="5"/>
    <text x="145" y="699" font-size="20">Admitted traffic</text>
    <line x1="475" y1="692" x2="545" y2="692" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="560" y="699" font-size="20">Requested work</text>
    <line x1="940" y1="692" x2="1010" y2="692" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1025" y="699" font-size="20">Baseline = 100 units/second</text>
    <text x="720" y="750" text-anchor="middle" font-size="19">Both panels use identical demand. Overlapping blue/orange lines mean all requested work is admitted.</text>
    <text x="720" y="784" text-anchor="middle" font-size="18" fill="#475569">Illustrative model: other scaling mechanisms are omitted. No latency, throughput, or pricing guarantee is implied.</text>
  </g>
</svg>
