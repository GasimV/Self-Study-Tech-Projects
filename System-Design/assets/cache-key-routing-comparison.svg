  <text x="600" y="47" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17283e" text-anchor="middle">How a cache key finds its server</text>
  <text x="600" y="77" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#40556f" text-anchor="middle">Follow P100 before and after adding cache node C4.</text>
