<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" role="img" aria-labelledby="title description">
  <title id="title">Routing P100 before and after adding a cache node</title>
  <desc id="description">The cache key catalog-title:P100 has illustrative hash 423. Modulo routing selects index 0, C1, with three nodes and index 3, C4, with four nodes. In consistent hashing, the first clockwise token is C3 at 500 before addition and C4 at 450 afterward. Only hashes above 300 through 450 inclusive change owners on the illustrated ring. The hash itself stays 423.</desc>
