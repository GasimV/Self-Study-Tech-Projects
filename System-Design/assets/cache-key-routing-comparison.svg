  <text x="628" y="225" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17283e" text-anchor="start">Consistent hashing</text>
  <text x="628" y="253" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#40556f" text-anchor="start">Move clockwise to the first server token.</text>
