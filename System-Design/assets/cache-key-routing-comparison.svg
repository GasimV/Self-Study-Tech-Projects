  <text x="649.5" y="141" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#a95110" text-anchor="middle">423</text>
  <text x="718" y="140" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#40556f" text-anchor="start">The same hash is used in both examples.</text>
  <rect x="24" y="184" width="570" height="635" rx="16" fill="#f3f7fb" stroke="#d1dce7" stroke-width="1"/>
  <text x="46" y="225" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17283e" text-anchor="start">Modulo routing</text>
  <text x="46" y="253" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#40556f" text-anchor="start">Divide by the node count and use the remainder.</text>
