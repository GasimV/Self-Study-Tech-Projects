<g font-family="Arial, Helvetica, sans-serif">
<text x="600" y="42" font-size="30" font-weight="700" text-anchor="middle" fill="#172033">One table, two ways to divide it</text>
<text x="600" y="73" font-size="20" font-weight="400" text-anchor="middle" fill="#475569">Horizontal splits rows. Vertical splits attributes and keeps the linking ID.</text>
