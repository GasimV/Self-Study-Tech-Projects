<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">Horizontal and vertical partitioning of the same student table</title>
<desc id="description">The original table has Tom, Mike, and Rob with their IDs, subjects, and grades. Horizontal partitioning keeps all columns but separates Tom and Mike from Rob. Vertical partitioning separates names from subjects and grades, retaining the same ID in both pieces. This is a general modeling illustration, not DynamoDB physical placement.</desc>
