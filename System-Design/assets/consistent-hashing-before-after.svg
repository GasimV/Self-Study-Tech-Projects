<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title description">
  <title id="title">Consistent hashing: circular rings before and after adding N5</title>
  <desc id="description">Two clockwise hash rings with positions 0 through 99. Before addition, servers N1, N2, N3, N4 have tokens 20, 45, 70, 90. The key customer:123 has illustrative hash 60 and maps clockwise to N3 at 70. After N5 joins at token 65, the same key maps to N5. Only primary ownership of the interval greater than 45 through 65 inclusive transfers from N3 to N5. Nodes represent storage servers; tokens are their ring positions, not connections between machines.</desc>
  <defs>
    <marker id="clock-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="lookup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1440" height="1030" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="720" y="47" text-anchor="middle" font-size="30" font-weight="700">Consistent hashing: before and after adding N5</text>
    <text x="720" y="81" text-anchor="middle" font-size="20">Hash a key, then move clockwise to the first server token.</text>
  <g transform="translate(24 0)">
    <rect x="0" y="110" width="684" height="704" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="342" y="151" text-anchor="middle" font-size="25" font-weight="700">BEFORE: four storage servers</text>
    <text x="342" y="181" text-anchor="middle" font-size="18">Each server has one token in this example.</text>
    <path d="M 397.62 581.19 A 180 180 0 0 1 196.38 515.80" fill="none" stroke="#67e8d1" stroke-width="25"/>
    <circle cx="342" cy="410" r="180" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="342" y="214" text-anchor="middle" font-size="16" fill="#475569">0 / wrap around</text>
    <path d="M 359.42 272.10 A 139 139 0 0 1 463.81 343.04" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#clock-arrow)"/>
    <text x="342" y="355" text-anchor="middle" font-size="18" fill="#475569">CLOCKWISE</text>
    <text x="342" y="397" text-anchor="middle" font-size="23" font-weight="700">HASH SPACE</text>
    <text x="342" y="427" text-anchor="middle" font-size="20">Positions 0–99</text>
    <text x="342" y="478" text-anchor="middle" font-size="22" fill="#92400e" font-weight="700">Lookup: 60 → 70</text>
    <path d="M 248.54 538.63 A 159 159 0 0 1 190.78 459.13" fill="none" stroke="#b45309" stroke-width="5" marker-end="url(#lookup-arrow)"/>
    <path d="M 513.19 354.38 L 524.00 339.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="524" y="300" width="140" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="594" y="327" text-anchor="middle" font-size="21" font-weight="700">N1: server</text>
    <text x="594" y="353" text-anchor="middle" font-size="18">Token 20</text>
    <circle cx="513.19" cy="354.38" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 397.62 581.19 L 426.00 618.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="426" y="600" width="226" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="539" y="627" text-anchor="middle" font-size="21" font-weight="700">N2: storage server</text>
    <text x="539" y="653" text-anchor="middle" font-size="18">Token 45</text>
    <circle cx="397.62" cy="581.19" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 170.81 465.62 L 150.00 460.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="18" y="425" width="132" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="84" y="452" text-anchor="middle" font-size="21" font-weight="700">N3: server</text>
    <text x="84" y="478" text-anchor="middle" font-size="18">Token 70</text>
    <circle cx="170.81" cy="465.62" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 236.20 264.38 L 220.00 260.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="104" y="180" width="204" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="206" y="207" text-anchor="middle" font-size="21" font-weight="700">N4: storage server</text>
    <text x="206" y="233" text-anchor="middle" font-size="18">Token 90</text>
    <circle cx="236.20" cy="264.38" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 236.20 555.62 L 270 648 L 310 680" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M 236.20 544.62 l 11 11 l -11 11 l -11 -11 z" fill="#fb923c" stroke="#92400e" stroke-width="2"/>
    <text x="256.20" y="559.62" font-size="19" font-weight="700" fill="#92400e">60</text>
    <rect x="234" y="680" width="300" height="67" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="384" y="707" text-anchor="middle" font-size="21" font-weight="700">Key: customer:123</text>
    <text x="384" y="732" text-anchor="middle" font-size="18">Hash = 60 (record position)</text>
    <text x="342" y="786" text-anchor="middle" font-size="18" font-weight="700">Highlighted range (45, 65] belongs to N3.</text>
  </g>
  <g transform="translate(732 0)">
    <rect x="0" y="110" width="684" height="704" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="342" y="151" text-anchor="middle" font-size="25" font-weight="700">AFTER: add N5 at token 65</text>
    <text x="342" y="181" text-anchor="middle" font-size="18">The key stays at 60; its owner changes.</text>
    <path d="M 397.62 581.19 A 180 180 0 0 1 196.38 515.80" fill="none" stroke="#67e8d1" stroke-width="25"/>
    <circle cx="342" cy="410" r="180" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="342" y="214" text-anchor="middle" font-size="16" fill="#475569">0 / wrap around</text>
    <path d="M 359.42 272.10 A 139 139 0 0 1 463.81 343.04" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#clock-arrow)"/>
    <text x="342" y="355" text-anchor="middle" font-size="18" fill="#475569">CLOCKWISE</text>
    <text x="342" y="397" text-anchor="middle" font-size="23" font-weight="700">HASH SPACE</text>
    <text x="342" y="427" text-anchor="middle" font-size="20">Positions 0–99</text>
    <text x="342" y="478" text-anchor="middle" font-size="22" fill="#92400e" font-weight="700">Lookup: 60 → 65</text>
    <path d="M 248.54 538.63 A 159 159 0 0 1 213.37 503.46" fill="none" stroke="#b45309" stroke-width="5" marker-end="url(#lookup-arrow)"/>
    <path d="M 513.19 354.38 L 524.00 339.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="524" y="300" width="140" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="594" y="327" text-anchor="middle" font-size="21" font-weight="700">N1: server</text>
    <text x="594" y="353" text-anchor="middle" font-size="18">Token 20</text>
    <circle cx="513.19" cy="354.38" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 397.62 581.19 L 426.00 618.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="426" y="600" width="226" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="539" y="627" text-anchor="middle" font-size="21" font-weight="700">N2: storage server</text>
    <text x="539" y="653" text-anchor="middle" font-size="18">Token 45</text>
    <circle cx="397.62" cy="581.19" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 170.81 465.62 L 150.00 460.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="18" y="425" width="132" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="84" y="452" text-anchor="middle" font-size="21" font-weight="700">N3: server</text>
    <text x="84" y="478" text-anchor="middle" font-size="18">Token 70</text>
    <circle cx="170.81" cy="465.62" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 236.20 264.38 L 220.00 260.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="104" y="180" width="204" height="70" rx="10" fill="#dbeafe" stroke="#52769b" stroke-width="1.5"/>
    <text x="206" y="207" text-anchor="middle" font-size="21" font-weight="700">N4: storage server</text>
    <text x="206" y="233" text-anchor="middle" font-size="18">Token 90</text>
    <circle cx="236.20" cy="264.38" r="10" fill="#2563eb" stroke="#172033" stroke-width="2"/>
    <path d="M 196.38 515.80 L 150.00 548.00" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <rect x="20" y="548" width="190" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="115" y="575" text-anchor="middle" font-size="21" font-weight="700">NEW N5: server</text>
    <text x="115" y="601" text-anchor="middle" font-size="18">Token 65</text>
    <circle cx="196.38" cy="515.80" r="10" fill="#fbbf24" stroke="#172033" stroke-width="2"/>
    <path d="M 236.20 555.62 L 270 648 L 310 680" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M 236.20 544.62 l 11 11 l -11 11 l -11 -11 z" fill="#fb923c" stroke="#92400e" stroke-width="2"/>
    <text x="256.20" y="559.62" font-size="19" font-weight="700" fill="#92400e">60</text>
    <rect x="234" y="680" width="300" height="67" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="384" y="707" text-anchor="middle" font-size="21" font-weight="700">Key: customer:123</text>
    <text x="384" y="732" text-anchor="middle" font-size="18">Hash = 60 (record position)</text>
    <text x="342" y="786" text-anchor="middle" font-size="18" font-weight="700">Range (45, 65] transfers from N3 to N5.</text>
  </g>
    <text x="48" y="853" font-size="23" font-weight="700">Read the picture</text>
    <text x="48" y="890" font-size="20"><tspan font-weight="700">Ring:</tspan> possible hash positions, increasing clockwise.</text>
    <text x="750" y="890" font-size="20"><tspan font-weight="700">Token:</tspan> a storage server's position on the ring.</text>
    <text x="48" y="927" font-size="20"><tspan font-weight="700">Key hash:</tspan> a record's position, shown by the orange diamond.</text>
    <text x="750" y="927" font-size="20"><tspan font-weight="700">Owner:</tspan> first server token reached clockwise.</text>
    <rect x="32" y="950" width="1376" height="55" rx="10" fill="#ecfdf5" stroke="#99d6bd"/>
    <text x="720" y="984" text-anchor="middle" font-size="19">Green range: hashes greater than 45 and up to 65, including 65. All other primary owners stay the same.</text>
  </g>
</svg>
