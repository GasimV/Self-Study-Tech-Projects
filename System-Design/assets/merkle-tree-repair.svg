<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
  <title id="title">Merkle-tree comparison: find and repair one differing block</title>
  <desc id="description">Replica A stores Alice, Bob, Carol, Dave. Replica B stores Alice, Bob, Carl, Dave. Each data block has a leaf hash. Adjacent leaves form two parent hashes; the parents form one root. Both roots differ, their left parents match and are skipped, and their right parents differ. Comparison finds Carol versus Carl in block 3, index 2; Dave matches. Orange highlights the differing path and green marks matching data. Hash labels are symbolic, not actual SHA-256 outputs. The demonstration explicitly chooses A as its repair source.</desc>
  <defs>
    <marker id="down-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1440" height="1060" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="720" y="45" text-anchor="middle" font-size="30" font-weight="700">Merkle trees: find the differing block</text>
    <text x="720" y="80" text-anchor="middle" font-size="20">Build hashes upward from the data. Compare downward from the roots.</text>
  <g transform="translate(24 0)" data-replica="A">
    <rect x="0" y="108" width="684" height="684" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="342" y="146" text-anchor="middle" font-size="26" font-weight="700">Replica A: reference for this demo</text>
    <rect x="18" y="282" width="324" height="423" rx="14" fill="#ecfdf5" stroke="#16805a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <path d="M 342 245 L 182 320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#down-arrow)"/>
    <path d="M 342 245 L 502 320" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 182 385 L 102 470 M 182 385 L 262 470" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 502 385 L 422 470" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 502 385 L 582 470" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#down-arrow)"/>
    <text x="342" y="173" text-anchor="middle" font-size="15" fill="#475569">ROOT HASH — compare first</text>
    <g data-kind="root">
      <rect x="227" y="180" width="230" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="342" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">R_A</text>
      <text x="342" y="232" text-anchor="middle" font-size="18" fill="#7c2d12">H(h12 || h34_A)</text>
    </g>

    <text x="342" y="301" text-anchor="middle" font-size="15" fill="#475569">PARENT HASHES</text>
    <g data-kind="parent" data-matches="true">
      <rect x="87" y="320" width="190" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="182" y="347" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h12</text>
      <text x="182" y="372" text-anchor="middle" font-size="18" fill="#14532d">H(h1 || h2)</text>
    </g>

    <g data-kind="parent" data-matches="false">
      <rect x="407" y="320" width="190" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="502" y="347" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">h34_A</text>
      <text x="502" y="372" text-anchor="middle" font-size="18" fill="#7c2d12">H(h3_A || h4)</text>
    </g>

    <text x="342" y="447" text-anchor="middle" font-size="15" fill="#475569">LEAF HASHES</text>
    <g data-kind="leaf" data-index="0">
      <rect x="32" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="102" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h1</text>
      <text x="102" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Alice)</text>
    </g>
    <path d="M 102 610 L 102 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g data-kind="leaf" data-index="1">
      <rect x="192" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="262" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h2</text>
      <text x="262" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Bob)</text>
    </g>
    <path d="M 262 610 L 262 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g data-kind="leaf" data-index="2">
      <rect x="352" y="470" width="140" height="74" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="422" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">h3_A</text>
      <text x="422" y="522" text-anchor="middle" font-size="18" fill="#7c2d12">H(Carol)</text>
    </g>
    <path d="M 422 610 L 422 544" fill="none" stroke="#b45309" stroke-width="3"/>
    <g data-kind="leaf" data-index="3">
      <rect x="512" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="582" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h4</text>
      <text x="582" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Dave)</text>
    </g>
    <path d="M 582 610 L 582 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="342" y="586" text-anchor="middle" font-size="15" fill="#475569">DATA BLOCKS — hash these first</text>
    <g data-kind="data" data-index="0">
      <rect x="32" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="102" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Alice</text>
      <text x="102" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 1</text>
    </g>
    <g data-kind="data" data-index="1">
      <rect x="192" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="262" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Bob</text>
      <text x="262" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 2</text>
    </g>
    <g data-kind="data" data-index="2">
      <rect x="352" y="610" width="140" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="422" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">Carol</text>
      <text x="422" y="662" text-anchor="middle" font-size="18" fill="#7c2d12">Block 3</text>
    </g>
    <g data-kind="data" data-index="3">
      <rect x="512" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="582" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Dave</text>
      <text x="582" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 4</text>
    </g>
    <text x="182" y="696" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">MATCH: skip this subtree</text>
    <text x="342" y="751" text-anchor="middle" font-size="19" font-weight="700">Source selection is an explicit demo policy.</text>
  </g>
  <g transform="translate(732 0)" data-replica="B">
    <rect x="0" y="108" width="684" height="684" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="342" y="146" text-anchor="middle" font-size="26" font-weight="700">Replica B: block 3 differs</text>
    <rect x="18" y="282" width="324" height="423" rx="14" fill="#ecfdf5" stroke="#16805a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <path d="M 342 245 L 182 320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#down-arrow)"/>
    <path d="M 342 245 L 502 320" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 182 385 L 102 470 M 182 385 L 262 470" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 502 385 L 422 470" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 502 385 L 582 470" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#down-arrow)"/>
    <text x="342" y="173" text-anchor="middle" font-size="15" fill="#475569">ROOT HASH — compare first</text>
    <g data-kind="root">
      <rect x="227" y="180" width="230" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="342" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">R_B</text>
      <text x="342" y="232" text-anchor="middle" font-size="18" fill="#7c2d12">H(h12 || h34_B)</text>
    </g>

    <text x="342" y="301" text-anchor="middle" font-size="15" fill="#475569">PARENT HASHES</text>
    <g data-kind="parent" data-matches="true">
      <rect x="87" y="320" width="190" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="182" y="347" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h12</text>
      <text x="182" y="372" text-anchor="middle" font-size="18" fill="#14532d">H(h1 || h2)</text>
    </g>

    <g data-kind="parent" data-matches="false">
      <rect x="407" y="320" width="190" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="502" y="347" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">h34_B</text>
      <text x="502" y="372" text-anchor="middle" font-size="18" fill="#7c2d12">H(h3_B || h4)</text>
    </g>

    <text x="342" y="447" text-anchor="middle" font-size="15" fill="#475569">LEAF HASHES</text>
    <g data-kind="leaf" data-index="0">
      <rect x="32" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="102" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h1</text>
      <text x="102" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Alice)</text>
    </g>
    <path d="M 102 610 L 102 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g data-kind="leaf" data-index="1">
      <rect x="192" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="262" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h2</text>
      <text x="262" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Bob)</text>
    </g>
    <path d="M 262 610 L 262 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g data-kind="leaf" data-index="2">
      <rect x="352" y="470" width="140" height="74" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="422" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">h3_B</text>
      <text x="422" y="522" text-anchor="middle" font-size="18" fill="#7c2d12">H(Carl)</text>
    </g>
    <path d="M 422 610 L 422 544" fill="none" stroke="#b45309" stroke-width="3"/>
    <g data-kind="leaf" data-index="3">
      <rect x="512" y="470" width="140" height="74" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="582" y="497" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">h4</text>
      <text x="582" y="522" text-anchor="middle" font-size="18" fill="#14532d">H(Dave)</text>
    </g>
    <path d="M 582 610 L 582 544" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="342" y="586" text-anchor="middle" font-size="15" fill="#475569">DATA BLOCKS — hash these first</text>
    <g data-kind="data" data-index="0">
      <rect x="32" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="102" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Alice</text>
      <text x="102" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 1</text>
    </g>
    <g data-kind="data" data-index="1">
      <rect x="192" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="262" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Bob</text>
      <text x="262" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 2</text>
    </g>
    <g data-kind="data" data-index="2">
      <rect x="352" y="610" width="140" height="65" rx="10" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
      <text x="422" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">Carl</text>
      <text x="422" y="662" text-anchor="middle" font-size="18" fill="#7c2d12">Block 3</text>
    </g>
    <g data-kind="data" data-index="3">
      <rect x="512" y="610" width="140" height="65" rx="10" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
      <text x="582" y="637" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Dave</text>
      <text x="582" y="662" text-anchor="middle" font-size="18" fill="#14532d">Block 4</text>
    </g>
    <text x="182" y="696" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">MATCH: skip this subtree</text>
    <text x="342" y="751" text-anchor="middle" font-size="19" font-weight="700">Block 3 is different, not automatically wrong.</text>
  </g>
    <rect x="40" y="817" width="22" height="22" rx="4" fill="#ecfdf5" stroke="#16805a" stroke-width="2"/>
    <text x="75" y="835" font-size="20">Green: matching hashes / data</text>
    <rect x="540" y="817" width="22" height="22" rx="4" fill="#fff1e6" stroke="#b45309" stroke-width="2"/>
    <text x="575" y="835" font-size="20">Orange: differing block and its path to the root</text>
    <text x="48" y="886" font-size="22" font-weight="700">1. Roots differ → inspect parents. The left parent matches: skip Alice and Bob.</text>
    <text x="48" y="924" font-size="22" font-weight="700">2. Right parents differ → inspect leaves. Carol / Carl differs; Dave matches.</text>
    <text x="48" y="962" font-size="22" font-weight="700">3. Trust A for this demo → copy block 3 → update B's hash path → roots match.</text>
    <rect x="32" y="990" width="1376" height="46" rx="10" fill="#eff6ff" stroke="#b4c7db"/>
    <text x="720" y="1020" text-anchor="middle" font-size="19">Labels are symbolic hashes. The tree finds disagreements; reconciliation rules decide what to retain.</text>
  </g>
</svg>
